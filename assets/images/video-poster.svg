<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="60%" stop-color="#111B32"/>
      <stop offset="100%" stop-color="#2C4D90"/>
    </linearGradient>
    <filter id="glowCircle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#vidBg)"/>
  
  <!-- Mountain contours inspired by Lonewolf moodboard -->
  <polygon points="0,450 140,290 280,450" fill="#0C1120" opacity="0.8"/>
  <polygon points="180,450 380,240 560,450" fill="#131F3A" opacity="0.6"/>
  <polygon points="460,450 630,280 800,450" fill="#0C1120" opacity="0.7"/>

  <!-- Moon / Glow center -->
  <circle cx="400" cy="190" r="48" fill="#3282E0" opacity="0.2" filter="url(#glowCircle)"/>
  <circle cx="400" cy="190" r="42" fill="#0C1120" stroke="#3282E0" stroke-width="3"/>
  <polygon points="392,172 416,190 392,208" fill="#3282E0"/>

  <text x="400" y="275" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle">PROMOTIONAL VIDEO</text>
  <text x="400" y="305" fill="#DFE0E0" font-family="'Montserrat', sans-serif" font-size="13" letter-spacing="1.5" text-anchor="middle">REPLACE WITH YOUR PROMO.MP4 IN /assets/videos/</text>
</svg>
