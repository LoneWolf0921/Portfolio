<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B30"/>
      <stop offset="50%" stop-color="#0C1120"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3282E0"/>
      <stop offset="100%" stop-color="#2C4D90"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)"/>
  <circle cx="200" cy="140" r="70" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="200" cy="140" r="55" fill="#131B30" stroke="#3282E0" stroke-width="2"/>
  <path d="M120 310 C120 240, 160 215, 200 215 C240 215, 280 240, 280 310" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M135 310 C135 255, 165 230, 200 230 C235 230, 265 255, 265 310" fill="#131B30" stroke="#3282E0" stroke-width="2"/>
  <!-- Geometric accents -->
  <polygon points="200,95 210,120 235,120 215,135 222,160 200,145 178,160 185,135 165,120 190,120" fill="none" stroke="#3282E0" stroke-width="1.5" opacity="0.6"/>
  <text x="200" y="355" fill="#DFE0E0" font-family="'Montserrat', sans-serif" font-size="14" text-anchor="middle" letter-spacing="3">DEVELOPER PHOTO</text>
  <text x="200" y="375" fill="#3282E0" font-family="'Montserrat', sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">PLACEHOLDER</text>
</svg>
